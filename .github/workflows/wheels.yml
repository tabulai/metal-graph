name: production wheels

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wheels-${{ github.ref }}
  # A release must never be canceled after publishing has begun.
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  macos-arm64:
    name: CPython 3.10–3.14 / macOS 14 / arm64
    # This is a runtime release gate, not merely a build label. If GitHub
    # retires macos-14, replace it with an actual Sonoma arm64 runner.
    runs-on: macos-14
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Require a release tag matching the package version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "Release tags must point at the current main branch tip." >&2
            exit 1
          fi
          project_version="$(
            python -c \
              'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])'
          )"
          if [ "$GITHUB_REF_NAME" != "v$project_version" ]; then
            echo "Release tag '$GITHUB_REF_NAME' must be 'v$project_version'." >&2
            exit 1
          fi

      - name: Verify the production runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"
          test "$(sw_vers -productVersion | cut -d. -f1)" = "14"
          test "$(sysctl -in hw.optional.arm64)" = "1"
          mkdir -p wheel-provenance
          {
            uname -a
            sw_vers
            echo "hardware_model=$(sysctl -n hw.model)"
            echo "machine=$(sysctl -n hw.machine)"
            echo "arm64=$(sysctl -in hw.optional.arm64)"
          } | tee wheel-provenance/macos14-arm64-runner.txt

      - name: Install the wheel builder
        run: python -m pip install "cibuildwheel==4.1.1"

      - name: Verify selected build identifiers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p wheel-provenance
          python -m cibuildwheel --platform macos --print-build-identifiers \
            | tee wheel-provenance/build-identifiers.txt
          python - <<'PY'
          from pathlib import Path

          expected = {
              "cp310-macosx_arm64",
              "cp311-macosx_arm64",
              "cp312-macosx_arm64",
              "cp313-macosx_arm64",
              "cp314-macosx_arm64",
          }
          actual = set(
              Path("wheel-provenance/build-identifiers.txt").read_text().splitlines()
          )
          assert actual == expected, (actual, expected)
          PY

      - name: Build and smoke-test production wheels
        shell: bash
        run: |
          set -euo pipefail
          python -m cibuildwheel --platform macos --output-dir wheelhouse \
            2>&1 | tee wheel-provenance/cibuildwheel.log

      - name: Verify wheel contents, metadata, native code, and Metal library
        run: |
          python .github/scripts/verify-production-wheels.py wheelhouse
          shasum -a 256 wheelhouse/*.whl \
            > wheel-provenance/SHA256SUMS

      - name: Prove an installed wheel on macOS 14 Apple Silicon
        shell: bash
        run: |
          set -euo pipefail
          proof_root="$RUNNER_TEMP/metal-graph-macos14-proof"
          python -m venv "$proof_root/venv"
          proof_python="$proof_root/venv/bin/python"
          wheels=(wheelhouse/*-cp313-cp313-macosx_14_0_arm64.whl)
          test "${#wheels[@]}" -eq 1
          wheel_path="$PWD/${wheels[0]}"
          cd "$proof_root"
          {
            test "$(uname -m)" = "arm64"
            test "$(sw_vers -productVersion | cut -d. -f1)" = "14"
            env -u PYTHONPATH "$proof_python" -I -m pip install \
              --only-binary=:all: "$wheel_path"
            env -u PYTHONPATH -u MG_REQUIRE_GPU -u MG_METALLIB MG_FORCE_CPU=1 \
              "$proof_python" -I \
              "$GITHUB_WORKSPACE/tests/wheel_smoke.py" \
              --expect cpu \
              --project-root "$GITHUB_WORKSPACE" \
              --require-macos-major 14
            env -u PYTHONPATH "$proof_python" -I -m pip check
          } 2>&1 | tee \
            "$GITHUB_WORKSPACE/wheel-provenance/macos14-runtime-proof.txt"

      - name: Record wheel builder version
        run: |
          python - <<'PY' > wheel-provenance/cibuildwheel.txt
          from importlib.metadata import version
          print(f"cibuildwheel={version('cibuildwheel')}")
          PY

      - name: Retain wheels and build provenance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: metal-graph-wheels-${{ github.sha }}
          path: |
            wheelhouse/*.whl
            wheel-provenance/**
          if-no-files-found: error
          retention-days: 90

  gpu-smoke:
    name: >-
      CPython ${{ matrix.python_version }} / macOS 15 / arm64 / forced GPU
    needs: macos-arm64
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - python_version: "3.10"
            python_tag: cp310
          - python_version: "3.11"
            python_tag: cp311
          - python_version: "3.12"
            python_tag: cp312
          - python_version: "3.13"
            python_tag: cp313
          - python_version: "3.14"
            python_tag: cp314
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python_version }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: metal-graph-wheels-${{ github.sha }}
          path: release-artifact

      - name: Install and exercise the forced-GPU path
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"
          test "$(sw_vers -productVersion | cut -d. -f1)" = "15"
          proof_root="$RUNNER_TEMP/metal-graph-${{ matrix.python_tag }}-gpu"
          python -m venv "$proof_root/venv"
          proof_python="$proof_root/venv/bin/python"
          wheels=(
            release-artifact/wheelhouse/*-${{ matrix.python_tag }}-${{ matrix.python_tag }}-macosx_14_0_arm64.whl
          )
          test "${#wheels[@]}" -eq 1
          wheel_path="$PWD/${wheels[0]}"
          cd "$proof_root"
          env -u PYTHONPATH "$proof_python" -I -m pip install \
            --only-binary=:all: "$wheel_path"
          env -u PYTHONPATH -u MG_FORCE_CPU -u MG_METALLIB MG_REQUIRE_GPU=1 \
            "$proof_python" -I \
            "$GITHUB_WORKSPACE/tests/wheel_smoke.py" \
            --expect gpu \
            --project-root "$GITHUB_WORKSPACE" \
            --require-macos-major 15
          env -u PYTHONPATH "$proof_python" -I -m pip check

  publish-testpypi:
    name: Publish wheels to TestPyPI
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: gpu-smoke
    runs-on: ubuntu-24.04
    environment:
      name: testpypi
      url: https://test.pypi.org/project/metal-graph/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: metal-graph-wheels-${{ github.sha }}
          path: release-artifact

      - name: Publish the validated wheels
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          packages-dir: release-artifact/wheelhouse/
          repository-url: https://test.pypi.org/legacy/

  smoke-testpypi:
    name: Install from TestPyPI with CPU and GPU
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: publish-testpypi
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install and exercise the TestPyPI wheel
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"
          test "$(sw_vers -productVersion | cut -d. -f1)" = "15"
          project_version="$(
            python -c \
              'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])'
          )"
          proof_root="$RUNNER_TEMP/metal-graph-testpypi-smoke"
          python -m venv "$proof_root/venv"
          proof_python="$proof_root/venv/bin/python"
          env -u PYTHONPATH "$proof_python" -I -m pip install \
            --only-binary=:all: "numpy>=1.24"
          for attempt in 1 2 3 4 5 6 7 8; do
            if env -u PYTHONPATH "$proof_python" -I -m pip install \
              --no-cache-dir --no-deps --only-binary=:all: \
              --index-url https://test.pypi.org/simple/ \
              "metal-graph==$project_version"; then
              break
            fi
            if [ "$attempt" = "8" ]; then
              echo "TestPyPI did not serve metal-graph==$project_version." >&2
              exit 1
            fi
            sleep 15
          done
          cd "$proof_root"
          env -u PYTHONPATH -u MG_REQUIRE_GPU -u MG_METALLIB MG_FORCE_CPU=1 \
            "$proof_python" -I \
            "$GITHUB_WORKSPACE/tests/wheel_smoke.py" \
            --expect cpu \
            --project-root "$GITHUB_WORKSPACE" \
            --require-macos-major 15
          env -u PYTHONPATH -u MG_FORCE_CPU -u MG_METALLIB MG_REQUIRE_GPU=1 \
            "$proof_python" -I \
            "$GITHUB_WORKSPACE/tests/wheel_smoke.py" \
            --expect gpu \
            --project-root "$GITHUB_WORKSPACE" \
            --require-macos-major 15
          env -u PYTHONPATH "$proof_python" -I -m pip check

  publish-pypi:
    name: Publish wheels to PyPI
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: smoke-testpypi
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/metal-graph/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: metal-graph-wheels-${{ github.sha }}
          path: release-artifact

      - name: Publish the validated wheels
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          packages-dir: release-artifact/wheelhouse/

  smoke-pypi:
    name: Install from PyPI with CPU and GPU
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: publish-pypi
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install and exercise the PyPI wheel
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"
          test "$(sw_vers -productVersion | cut -d. -f1)" = "15"
          project_version="$(
            python -c \
              'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])'
          )"
          proof_root="$RUNNER_TEMP/metal-graph-pypi-smoke"
          python -m venv "$proof_root/venv"
          proof_python="$proof_root/venv/bin/python"
          for attempt in 1 2 3 4 5 6 7 8; do
            if env -u PYTHONPATH "$proof_python" -I -m pip install \
              --no-cache-dir --only-binary=:all: \
              "metal-graph==$project_version"; then
              break
            fi
            if [ "$attempt" = "8" ]; then
              echo "PyPI did not serve metal-graph==$project_version." >&2
              exit 1
            fi
            sleep 15
          done
          cd "$proof_root"
          env -u PYTHONPATH -u MG_REQUIRE_GPU -u MG_METALLIB MG_FORCE_CPU=1 \
            "$proof_python" -I \
            "$GITHUB_WORKSPACE/tests/wheel_smoke.py" \
            --expect cpu \
            --project-root "$GITHUB_WORKSPACE" \
            --require-macos-major 15
          env -u PYTHONPATH -u MG_FORCE_CPU -u MG_METALLIB MG_REQUIRE_GPU=1 \
            "$proof_python" -I \
            "$GITHUB_WORKSPACE/tests/wheel_smoke.py" \
            --expect gpu \
            --project-root "$GITHUB_WORKSPACE" \
            --require-macos-major 15
          env -u PYTHONPATH "$proof_python" -I -m pip check
