# metal-graph CI (plan section 9).
#
# Hosted macos-15 arm64 runners provide Metal. Performance is meaningless
# there, so CI is build, correctness, ABI, and packaging only. The optional
# perf job stays manual until a labeled physical runner is provisioned.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_perf:
        description: "Run the physical Apple Silicon benchmark smoke suite"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MACOSX_DEPLOYMENT_TARGET: "14.0"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Ruff
        run: |
          python -m pip install \
            "ruff>=0.15" "numpy>=2" "pytest>=8" \
            "igraph>=0.11" "rustworkx>=0.15"
          python -m ruff check python bench tests examples

      - name: Benchmark integrity tests
        run: |
          python -c "import igraph, rustworkx"
          python -m pytest tests/test_bench_report.py -q

  sanitizers:
    name: native sanitizers (CPU path)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure with ASan and UBSan
        run: |
          cmake -S . -B build/sanitize \
            -DCMAKE_BUILD_TYPE=Debug \
            -DMG_BUILD_PYTHON=OFF \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build/sanitize -j 3

      - name: C ABI tests under sanitizers
        env:
          ASAN_OPTIONS: "halt_on_error=1"
          UBSAN_OPTIONS: "halt_on_error=1:print_stacktrace=1"
          MG_FORCE_CPU: "1"
        run: ctest --test-dir build/sanitize --output-on-failure

  build-and-test:
    name: >-
      build-and-test (Python ${{ matrix.python-version }},
      ${{ matrix.numpy-spec }}, GPU required)
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            numpy-spec: "numpy==1.24.0"
          - python-version: "3.11"
            numpy-spec: "numpy>=2"
          - python-version: "3.12"
            numpy-spec: "numpy>=2"
          - python-version: "3.13"
            numpy-spec: "numpy>=2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "${{ matrix.numpy-spec }}" "networkx>=3.4" "scipy>=1.11" \
            "nanobind>=2.13" "pytest>=8" "build>=1.2"

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DPython_EXECUTABLE="$(python -c 'import sys; print(sys.executable)')"

      - name: Build
        run: cmake --build build -j 3

      - name: C++ smoke tests (ctest)
        env:
          MG_REQUIRE_GPU: "1"
        run: ctest --test-dir build --output-on-failure

      - name: Python golden tests (GPU required, path asserted)
        env:
          MG_REQUIRE_GPU: "1"
          PYTHONPATH: python
        run: python -m pytest tests -v -ra --durations=15

      - name: Build wheel
        run: python -m build --wheel

      - name: Verify wheel tag and isolated import
        run: |
          python - <<'PY'
          from pathlib import Path
          wheels = list(Path("dist").glob("*.whl"))
          assert len(wheels) == 1, wheels
          assert "macosx_14_0_arm64" in wheels[0].name, wheels[0]
          PY
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd /tmp
          python - <<'PY'
          import importlib.metadata
          import metal_graph as mg
          assert mg.__version__ == "0.1.0"
          assert importlib.metadata.version("metal-graph") == mg.__version__
          assert isinstance(mg.has_gpu(), bool)
          print("wheel smoke:", mg.__version__, "gpu:", mg.has_gpu())
          PY

      - name: Upload wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: metal-graph-wheel-py${{ matrix.python-version }}
          path: dist/*.whl
          if-no-files-found: error

  perf-smoke:
    name: perf-smoke (self-hosted physical Apple Silicon)
    if: >-
      ${{ github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/main' && inputs.run_perf }}
    runs-on: [self-hosted, macos, arm64, metal]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure and build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j

      - name: Bench smoke suite (physical hardware)
        env:
          MG_REQUIRE_GPU: "1"
          PYTHONPATH: python
        run: python3 bench/run.py --suite smoke --runs 20

      - name: Upload bench results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-results-${{ github.run_id }}
          path: |
            bench/results/*.json
            bench/results/*.md
          if-no-files-found: error
