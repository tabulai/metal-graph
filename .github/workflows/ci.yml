# metal-graph CI (plan section 9).
#
# job 1: hosted macos-15 arm64 (M1-class VM). Metal IS present on these
#   runners; performance is meaningless there and that is fine — this job
#   is build + correctness only. MG_REQUIRE_GPU=1 makes device absence a
#   hard failure: no silent CPU fallback, ever.
# job 2: perf smoke on a self-hosted physical Apple Silicon runner, gated
#   on workflow_dispatch + nightly schedule. Perf numbers only ever come
#   from physical hardware.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * *" # nightly perf smoke (UTC)

jobs:
  build-and-test:
    name: build-and-test (macos-15 arm64, GPU required)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=2" "networkx>=3.4" nanobind pytest

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DPython_EXECUTABLE="$(python -c 'import sys; print(sys.executable)')"

      - name: Build
        run: cmake --build build -j 3

      - name: C++ smoke tests (ctest)
        env:
          MG_REQUIRE_GPU: "1"
        run: ctest --test-dir build --output-on-failure

      - name: Python golden tests (GPU required, path asserted)
        env:
          MG_REQUIRE_GPU: "1"
          PYTHONPATH: python
        run: python -m pytest tests -v -ra --durations=15

  perf-smoke:
    name: perf-smoke (self-hosted physical Apple Silicon)
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: [self-hosted, macos, arm64, metal]
    timeout-minutes: 120
    # The self-hosted runner is pre-provisioned: Xcode CLT, cmake, and a
    # python3 with numpy + networkx + nanobind on PATH.
    steps:
      - uses: actions/checkout@v4

      - name: Configure and build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j

      - name: Bench smoke suite (physical hardware)
        env:
          MG_REQUIRE_GPU: "1"
          PYTHONPATH: python
        run: python3 bench/run.py --suite smoke --runs 20

      - name: Upload bench results
        uses: actions/upload-artifact@v4
        with:
          name: bench-results-${{ github.run_id }}
          path: |
            bench/results/*.json
            bench/results/*.md
          if-no-files-found: error
