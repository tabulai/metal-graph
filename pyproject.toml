# metal-graph — Metal-native graph analytics for Apple Silicon.

[build-system]
requires = ["scikit-build-core>=1.0", "nanobind>=2.13"]
build-backend = "scikit_build_core.build"

[project]
name = "metal-graph"
version = "0.1.0"
description = "Metal-native graph analytics for Apple Silicon"
authors = [{ name = "TabulAI" }]
readme = "README.md"
license = "Apache-2.0"
license-files = [
  "LICENSE",
  "third_party/metal-cpp/LICENSE.txt",
  "THIRD_PARTY_NOTICES.md",
]
requires-python = ">=3.10,<3.14"
dependencies = ["numpy>=1.24"]
keywords = ["graph", "analytics", "metal", "apple-silicon", "pagerank", "bfs"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
test = [
  "build>=1.2",
  "networkx>=3.4",
  "pytest>=8",
  "ruff>=0.15",
  "scipy>=1.11",
]
benchmark = [
  "igraph>=0.11",
  "networkx>=3.4",
  "rustworkx>=0.15",
  "scipy>=1.11",
]

[project.urls]
Repository = "https://github.com/tabulai/metal-graph"
Issues = "https://github.com/tabulai/metal-graph/issues"
Changelog = "https://github.com/tabulai/metal-graph/blob/main/CHANGELOG.md"

[tool.scikit-build]
cmake.version = ">=3.24"
wheel.packages = ["python/metal_graph"]
build-dir = "build/{wheel_tag}"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402"]
